      const setDarkMode = () => {
        const theme = (() => {
          if (
            typeof localStorage !== "undefined" &&
            localStorage.getItem("theme")
          ) {
            return localStorage.getItem("theme")
          }
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            return "dark"
          }
          return "light"
        })()

        if (theme === "light") {
          document.documentElement.classList.remove("dark")
        } else {
          document.documentElement.classList.add("dark")
        }
      }

      // Set immediately to prevent FOUC
      setDarkMode()
      document.addEventListener("astro:after-swap", setDarkMode)

      // Listen for 'D' keypress to toggle theme
      document.addEventListener("keydown", (e) => {
        const target = e.target
        // Ignore if user is typing inside an input or textarea
        if (
          target.tagName === "INPUT" ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable
        ) {
          return
        }

        if (e.key.toLowerCase() === "d") {
          const isDark = document.documentElement.classList.toggle("dark")
          localStorage.setItem("theme", isDark ? "dark" : "light")
        }
      })

      // Parallax effect function
      function initParallax() {
        const video = document.getElementById("bg-video")
        if (!video) return

        window.addEventListener("mousemove", (e) => {
          const moveX = (e.clientX - window.innerWidth / 2) / -40
          const moveY = (e.clientY - window.innerHeight / 2) / -40
          video.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`
        })
      }

      // Initialize on first load and subsequent view transitions
      document.addEventListener("astro:page-load", initParallax)

      if (
        document.readyState === "complete" ||
        document.readyState === "interactive"
      ) {
        initParallax()
      } else {
        document.addEventListener("DOMContentLoaded", initParallax)
      }
    </script></body></html>
